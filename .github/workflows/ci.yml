name: Offline quality checks
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test tools
        run: python -m pip install pytest PyYAML python-dotenv ruff
      - name: Lint
        run: ruff check scripts python_tests
      - name: Tests
        run: python -m pytest -q
      - name: Generate demo data
        run: python -m scripts.generate_data --profile demo
      - name: Validate YAML
        run: python -m scripts.validate_yaml

